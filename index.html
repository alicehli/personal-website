<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alice Li - Software & Stories</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav>
      <ul class="nav-links"></ul>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
      <div class="hero-content">
        <div class="hero-subtitle"><!-- Populated by JavaScript --></div>
        <h1 class="hero-title"><!-- Populated by JavaScript --></h1>
        <p class="hero-intro"><!-- Populated by JavaScript --></p>

        <div class="hero-description" id="hero-description">
          <!-- Populated by JavaScript -->
        </div>

        <div class="hero-notes">
          <!-- Populated by JavaScript -->
        </div>

        <div class="hero-meta">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </section>

    <!-- Reading Section -->
    <section id="reading" class="portfolio-section">
      <div class="section-header">
        <div class="section-subtitle">You can always find me reading...</div>
        <h2 class="section-title">Books I Love</h2>
      </div>
      <div class="reading-widget">
        <div class="books-carousel-container">
          <div class="books-carousel"><!-- Populated by JavaScript --></div>
        </div>
        <div class="reading-widget-footer">
          Here's an
          <a
            href="https://aliceinstories.com"
            target="_blank"
            rel="noopener noreferrer"
            >interactive display of all the books I've read as an adult</a
          >
        </div>
      </div>
    </section>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
