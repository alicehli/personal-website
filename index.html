<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alice Li - Engineer & Storyteller. Portfolio showcasing projects, photography, and writing at the intersection of data and human experience.">
    <title>Alice Li - Engineer & Storyteller</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <div class="hero-subtitle"><!-- Populated by JavaScript --></div>
            <h1 class="hero-title"><!-- Populated by JavaScript --></h1>
            <div class="typewriter-container">
                <div class="typewriter-text" id="typewriter-text"></div>
            </div>
            
            <div class="hero-description" id="hero-description">
                <!-- Populated by JavaScript -->
            </div>
            
            <div class="currently-working-bubble" id="currently-working-bubble">
                <!-- Populated by JavaScript -->
            </div>
            
            <div class="hero-meta">
                <!-- Populated by JavaScript -->
            </div>
        </div>
        
        <!-- Photo Grid -->
        <div class="photo-grid">
            <!-- Populated by JavaScript -->
        </div>
    </section>
    
    <!-- Reading Section -->
    <section id="reading" class="portfolio-section">
        <div class="section-header">
            <div class="section-subtitle">You can always find me reading...</div>
            <h2 class="section-title">Books I love</h2>
        </div>
        <div class="reading-widget">
            <!-- Populated by JavaScript (widget embed) -->
        </div>
    </section>
    
    <!-- Contact Section -->
    <section id="contact" class="portfolio-section contact-section">
        <div class="section-header">
            <div class="section-subtitle">Get In Touch</div>
            <h2 class="section-title">Contact</h2>
        </div>
        <div class="contact-content">
            <p class="contact-description">
                <span class="contact-pink">Ask me about:</span> bungee jumping every year, my favourite musicals, reading 30+ books a year, and fitness activities in NYC.
            </p>
            <div class="contact-links">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Data and Scripts -->
    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script src="script.js"></script>
</body>
</html>
